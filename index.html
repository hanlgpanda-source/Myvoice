<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>English Pronunciation Scoring</title>

  <style>
    body{
      font-family: Arial;
      background:#f4f7fb;
      padding:40px;
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:16px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:#333;
    }

    textarea{
      width:100%;
      height:120px;
      padding:15px;
      font-size:18px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-top:10px;
    }

    button{
      padding:12px 24px;
      font-size:18px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      margin-top:20px;
      background:#2563eb;
      color:white;
    }

    button:hover{
      background:#1d4ed8;
    }

    .result{
      margin-top:30px;
      padding:20px;
      background:#f9fafb;
      border-radius:10px;
    }

    .good{
      color:green;
      font-weight:bold;
    }

    .bad{
      color:red;
      font-weight:bold;
    }

    .score{
      font-size:40px;
      font-weight:bold;
      color:#2563eb;
    }

    .spoken{
      margin-top:10px;
      line-height:2;
    }

  </style>
</head>
<body>

<div class="container">

  <h1>English Pronunciation Scorer</h1>

  <h3>Reference Sentence</h3>

  <textarea id="targetText">
The quick brown fox jumps over the lazy dog
  </textarea>

  <br>

  <button onclick="startRecognition()">
    🎤 Start Speaking
  </button>

  <div class="result">

    <h3>Pronunciation Score</h3>

    <div class="score" id="score">
      0%
    </div>

    <h3>Recognized Speech</h3>

    <div id="spokenText" class="spoken"></div>

  </div>

</div>

<script>

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert("Your browser does not support Speech Recognition");
}

const recognition = new SpeechRecognition();

recognition.lang = 'en-US';
recognition.interimResults = false;
recognition.maxAlternatives = 1;

function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[.,!?]/g, '')
    .trim();
}

function calculateScore(target, spoken) {

  const targetWords = normalize(target).split(' ');
  const spokenWords = normalize(spoken).split(' ');

  let correct = 0;

  let html = "";

  targetWords.forEach((word, index) => {

    if (spokenWords[index] === word) {
      correct++;
      html += `<span class="good">${word}</span> `;
    } else {
      html += `<span class="bad">${word}</span> `;
    }

  });

  const score = Math.round(
    (correct / targetWords.length) * 100
  );

  return {
    score,
    html
  };
}

function startRecognition() {

  recognition.start();

}

recognition.onstart = () => {

  document.getElementById("spokenText").innerHTML =
    "Listening...";

};

recognition.onresult = (event) => {

  const spokenText =
    event.results[0][0].transcript;

  const targetText =
    document.getElementById("targetText").value;

  const result =
    calculateScore(targetText, spokenText);

  document.getElementById("score").innerText =
    result.score + "%";

  document.getElementById("spokenText").innerHTML =
    `
    <p><b>You said:</b> ${spokenText}</p>
    <p>${result.html}</p>
    `;

};

recognition.onerror = (event) => {

  document.getElementById("spokenText").innerHTML =
    "Error: " + event.error;

};

</script>

</body>
</html>
