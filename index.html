<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Chấm Điểm Phát Âm Tiếng Anh</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 550px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .nav-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn-nav {
            background-color: #34495e;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 5px;
        }
        .btn-nav:hover {
            background-color: #2c3e50;
        }
        .sentence-counter {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: bold;
        }
        .sentence-box {
            background-color: #eef2f7;
            padding: 20px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            border-left: 5px solid #3498db;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #27ae60;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 25px;
            text-align: left;
            min-height: 120px;
        }
        .score {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
        .status {
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 10px;
            text-align: center;
            height: 20px;
        }
        .diff {
            font-size: 18px;
            line-height: 1.5;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
        }
        .match { color: #2ecc71; font-weight: bold; }
        .mismatch { color: #e74c3c; font-weight: bold; text-decoration: line-through; }
    </style>
</head>
<body>

<div class="container">
    <h1>Phát Âm Chuẩn Anh - Mỹ (US)</h1>
    <div class="status" id="status">Nhấn nút bên dưới và bắt đầu nói</div>
    
    <!-- Bộ điều hướng câu hỏi -->
    <div class="nav-box">
        <button class="btn-nav" id="btnPrev">⏮ Câu trước</button>
        <span class="sentence-counter" id="counter">Câu 1 / 1</span>
        <button class="btn-nav" id="btnNext">Câu tiếp ⏭</button>
    </div>

    <!-- Hiển thị câu cần đọc -->
    <div class="sentence-box" id="targetSentence">Loading...</div>
    
    <button id="btnSpeak">🎤 Bắt đầu nói</button>

    <div class="result-box">
        <div class="score" id="score">-- %</div>
        <div class="diff" id="diffResult"></div>
    </div>
</div>

<script>
    // Danh sách các câu tiếng Anh để luyện tập (Bạn có thể thêm bớt tùy ý ở đây)
    const sentences = [
        "Beautiful day to learn coding",
        "How is the weather today in New York",
        "I would like to order a hot cup of coffee",
        "Practice makes perfect",
        "Can you tell me how to get to the train station",
        "An apple a day keeps the doctor away",
        "Success is not final failure is not fatal",
        "Where there is a will there is a way"
    ];

    let currentIndex = 0;

    // Kiểm tra Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Trình duyệt của bạn không hỗ trợ Web Speech API. Vui lòng dùng Google Chrome.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const btnSpeak = document.getElementById('btnSpeak');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const status = document.getElementById('status');
        const targetSentence = document.getElementById('targetSentence');
        const scoreDisplay = document.getElementById('score');
        const diffResult = document.getElementById('diffResult');
        const counter = document.getElementById('counter');

        // Hàm cập nhật câu hiện tại lên giao diện
        function updateSentence() {
            targetSentence.innerText = sentences[currentIndex];
            counter.innerText = `Câu ${currentIndex + 1} / ${sentences.length}`;
            
            // Reset lại vùng kết quả khi chuyển câu
            scoreDisplay.innerText = "-- %";
            scoreDisplay.style.color = "#333";
            diffResult.innerHTML = "";
            status.innerText = "Sẵn sàng! Hãy nhấn nút và đọc câu trên.";
            
            // Vô hiệu hóa nút nếu ở đầu/cuối danh sách
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === sentences.length - 1;
        }

        // Khởi tạo câu đầu tiên
        updateSentence();

        // Xử lý nút điều hướng
        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSentence();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
                updateSentence();
            }
        });

        // Khi nhấn nút nói
        btnSpeak.addEventListener('click', () => {
            recognition.start();
            status.innerText = "Đang lắng nghe... Hãy nói to, rõ ràng.";
            btnSpeak.disabled = true;
            scoreDisplay.innerText = "-- %";
            diffResult.innerHTML = "";
        });

        // Khi nhận diện xong
        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript;
            status.innerText = "Đang xử lý kết quả...";
            calculateScore(sentences[currentIndex], userSpeech);
        };

        recognition.onerror = (event) => {
            status.innerText = "Có lỗi xảy ra: " + event.error;
            btnSpeak.disabled = false;
        };

        recognition.onend = () => {
            btnSpeak.disabled = false;
        };

        // Hàm so sánh và chấm điểm
        function calculateScore(target, user) {
            const cleanText = text => text.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"").split(/\s+/);
            
            const targetWords = cleanText(target);
            const userWords = cleanText(user);

            let matchCount = 0;
            let htmlOutput = "<strong>Bạn đã nói:</strong> ";

            targetWords.forEach((word) => {
                if (userWords.includes(word)) {
                    matchCount++;
                    htmlOutput += `<span class="match">${word}</span> `;
                } else {
                    htmlOutput += `<span class="mismatch">${word}</span> `;
                }
            });

            const finalScore = Math.round((matchCount / targetWords.length) * 100);

            scoreDisplay.innerText = finalScore + "%";
            if (finalScore >= 80) {
                scoreDisplay.style.color = "#2ecc71";
                status.innerText = "Tuyệt vời! Phát âm rất chuẩn.";
            } else if (finalScore >= 50) {
                scoreDisplay.style.color = "#f39c12";
                status.innerText = "Khá tốt, hãy luyện tập thêm các từ màu đỏ.";
            } else {
                scoreDisplay.style.color = "#e74c3c";
                status.innerText = "Thử lại lần nữa nào!";
            }

            diffResult.innerHTML = htmlOutput + `<br><br><i>(Máy nghe được: "${user}")</i>`;
        }
    }
</script>

</body>
</html>
